spring.application.name=progress-service
server.port=8082

# ---------------------------------------------------------------------------
# RabbitMQ (Docker local). Em container, SPRING_RABBITMQ_HOST=rabbitmq sobrescreve o host.
# ---------------------------------------------------------------------------
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin
spring.rabbitmq.connection-timeout=10000

# Publisher confirms + returns: o broker confirma cada publicação e devolve mensagens sem rota
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Consumo: ACK automático após sucesso do listener; falha definitiva -> reject sem requeue -> DLQ
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=10

# Retry com backoff exponencial: 1s, 2s, 4s (3 retentativas) e então DLQ
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s
spring.rabbitmq.listener.simple.retry.max-retries=3

# ---------------------------------------------------------------------------
# Topologia (exchanges, routing keys e filas)
# ---------------------------------------------------------------------------
app.rabbitmq.events-exchange=courses.events
app.rabbitmq.dead-letter-exchange=courses.dlx
app.rabbitmq.routing-keys.lesson-completed=progress.lesson.completed
app.rabbitmq.routing-keys.course-completed=progress.course.completed
app.rabbitmq.routing-keys.enrollment-events=enrollment.*
app.rabbitmq.queues.enrollment-events=progress.enrollment-events.queue

# ---------------------------------------------------------------------------
# Banco de dados SQLite (arquivo ./data/progress.db)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:sqlite:${DATA_DIR:./data}/progress.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite aceita um único escritor por vez: uma conexão evita "database is locked"
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Observabilidade e logs
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
logging.level.br.com.cursosonline=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%-18.18thread] %-40.40logger{39} : %msg%n
